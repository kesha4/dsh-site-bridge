<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DSH Site Bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#2a45e0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4562f2"/>
      <stop offset="1" stop-color="#2739c8"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- the page: white, so the mark keeps contrast on any toolbar theme -->
  <rect x="14" y="16" width="100" height="96" rx="18" fill="#ffffff"/>

  <!-- browser bar -->
  <line x1="14" y1="41" x2="114" y2="41" stroke="url(#ink)" stroke-width="5" opacity="0.9"/>
  <circle cx="27" cy="28.5" r="3" fill="url(#ink)"/>
  <circle cx="38" cy="28.5" r="3" fill="url(#ink)" opacity="0.55"/>
  <circle cx="49" cy="28.5" r="3" fill="url(#ink)" opacity="0.35"/>

  <!-- DSH inside the page -->
  <path d="M72 60 L 96 43 L 88 65 L 96 87 L 70 76 Z" fill="url(#ink)"/>
  <path d="M24 86 C 24 67, 42 53, 63 55 C 82 57, 91 68, 90 80 C 89 94, 72 101, 53 97 C 37 94, 24 93, 24 86 Z"
        fill="url(#ink)"/>
  <circle cx="44" cy="76" r="3.4" fill="#ffffff" opacity="0.95"/>
</svg>
