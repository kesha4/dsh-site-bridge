<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>DSH Site Bridge</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161b;
        --card: #1b1e25;
        --line: #2a2f3a;
        --text: #e8eaf0;
        --muted: #99a1ae;
        --accent: #5b7cff;
        --accent-ink: #0b1020;
        --ok: #35c88f;
        --warn: #f0a04d;
        --err: #ef6b6b;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { overflow-x: hidden; }
      body {
        margin: 0;
        width: 340px;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      }

      header { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
      header img { width: 30px; height: 30px; border-radius: 8px; flex: none; }
      h1 { margin: 0; font-size: 13.5px; font-weight: 600; }
      .tagline { margin: 0; color: var(--muted); font-size: 10.5px; }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px;
        margin-bottom: 8px;
      }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      h2 { margin: 0; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

      .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(53, 200, 143, 0.15); }
      .dot.warn { background: var(--warn); }
      .dot.err { background: var(--err); }
      .spin {
        width: 9px; height: 9px; flex: none; border-radius: 50%;
        border: 2px solid rgba(240, 160, 77, 0.25); border-top-color: var(--warn);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

      .target { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: 8px 0; padding: 7px 8px; background: #15181e; border: 1px solid var(--line); border-radius: 7px; }
      .target-title { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .target-url { margin-top: 1px; color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .target.empty .target-title { color: var(--muted); font-weight: 400; }

      button {
        padding: 7px 10px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #20242d;
        color: var(--text);
        font: inherit;
        cursor: pointer;
        transition: border-color 0.12s, background 0.12s;
      }
      button:hover:not(:disabled) { border-color: #3a4150; background: #242935; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary#claim-more { margin-top: 8px; font-size: 12px; padding: 7px 10px; }
      button.primary { width: 100%; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
      button.primary:hover:not(:disabled) { background: #6b8aff; border-color: #6b8aff; }
      button.primary:disabled { background: #20242d; border-color: var(--line); color: var(--muted); font-weight: 500; }
      button.ghost { padding: 3px 8px; font-size: 11px; background: transparent; color: var(--muted); }
      button.icon {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 4px; width: 26px; height: 26px; background: transparent;
        border: 1px solid var(--line); border-radius: 6px; color: var(--muted);
      }
      button.icon:hover:not(:disabled) { color: var(--text); border-color: #3a4150; }
      button.icon.active { color: var(--accent); border-color: var(--accent); }
      button.icon.paused { color: var(--warn); border-color: var(--warn); background: rgba(240, 160, 77, 0.08); }
      button.ghost:hover:not(:disabled) { color: var(--text); }
      button.link {
        padding: 0; border: none; background: none; color: var(--accent);
        font-size: 11px; text-decoration: underline; text-underline-offset: 2px;
      }
      button.link:hover:not(:disabled) { color: #7e98ff; background: none; }

      .target-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
      .tabs-list {
        display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto;
        margin-top: 8px; scrollbar-width: thin; scrollbar-color: #3a4150 transparent;
      }
      .tabs-list::-webkit-scrollbar { width: 6px; }
      .tabs-list::-webkit-scrollbar-thumb { background: #3a4150; border-radius: 3px; }
      .tabs-list::-webkit-scrollbar-track { background: transparent; }
      .tab-item {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 6px 8px; background: #15181e; border: 1px solid var(--line);
        border-radius: 7px; min-height: 44px;
      }
      .tab-meta { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10.5px; flex: none; }
      .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
      .tab-item-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
      .tab-item-title { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab-item-url { color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .capture-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
      .capture-row button { padding: 5px 9px; font-size: 11.5px; }
      select {
        background: #15181e; color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; font: inherit; font-size: 11.5px; padding: 3px 6px; max-width: 200px;
      }

      details.card { padding: 0; }
      summary {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 9px; cursor: pointer; list-style: none; font-size: 10.5px;
        font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
      }
      summary::-webkit-details-marker { display: none; }
      summary::after { content: "▾"; font-size: 10px; opacity: 0.7; }
      details[open] summary::after { content: "▴"; }
      .details-body { padding: 0 9px 9px; }

      label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
      .row-label { display: flex; justify-content: space-between; align-items: baseline; }
      input {
        width: 100%; margin-top: 3px; padding: 6px 8px;
        background: #15181e; color: var(--text);
        border: 1px solid var(--line); border-radius: 7px; font: inherit;
      }
      input:focus { outline: none; border-color: var(--accent); }
      input[type="password"] { letter-spacing: 0.12em; }

      .hint { margin: 7px 0 0; color: var(--muted); font-size: 10.5px; }
      .hint code { background: #10131a; padding: 1px 4px; border-radius: 4px; font-size: 10px; }
      .muted { color: var(--muted); font-size: 11px; }
      .status-note { margin: 7px 0 0; font-size: 11px; color: var(--muted); }
      .status-note.err { color: var(--err); }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-128.png" alt="" width="30" height="30" />
      <div>
        <h1 data-i18n="appName">DSH Site Bridge</h1>
        <p class="tagline" data-i18n="tagline">DeepSeek Harness в вашем браузере</p>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <span class="pill"><i class="dot" id="dot"></i><i class="spin" id="spin" hidden></i><span id="connection-text" data-i18n="statusConnecting">Проверяю…</span></span>
        <span style="display:flex;gap:6px;align-items:center">
          <button class="icon" id="pause" data-i18n-title="pauseHint" title="Приостановить связь">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 2 H5.5 V10 H3.5 Z M6.5 2 H8.5 V10 H6.5 Z" fill="currentColor"/></svg>
          </button>
          <button class="icon" id="pick" data-i18n-title="pickHint" title="Pick an element">
            <svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 2 L3 16 L7.2 12.2 L9.6 17.6 L12.2 16.4 L9.8 11.2 L15 11.2 Z" fill="currentColor"/></svg>
          </button>
        </span>
      </div>

      <div class="target empty" id="target-block">
        <div class="target-text">
          <div class="target-title" data-i18n="targetNoneTitle">Вкладка не подключена</div>
          <div class="target-url" data-i18n="targetNoneUrl">Откройте нужную страницу и подключите её</div>
        </div>
      </div>

      <button class="primary" id="claim" data-i18n="connectTab">Подключить эту вкладку</button>
      <p class="status-note" id="status-note" hidden></p>

      <button class="primary" id="claim-more" hidden data-i18n="attachAnother">Подключить ещё вкладку</button>

      <div class="tabs-list" id="tabs-list" hidden></div>

      <div class="capture-row">
        <span class="muted" id="captured">0</span>
        <button id="capture" data-i18n="captureShortOff">Запись: выкл</button>
      </div>
    </section>

    <details class="card" id="pairing">
      <summary><span data-i18n="connectionTitle">Подключение</span><span class="muted" id="endpoint"></span></summary>
      <div class="details-body">
        <label for="port">
          <span class="row-label"><span data-i18n="portLabel">Порт моста</span></span>
          <input id="port" type="number" min="1024" max="65535" placeholder="47321" />
        </label>

        <label for="token">
          <span class="row-label"><span data-i18n="tokenLabel">Токен</span><span id="token-len" class="muted"></span></span>
          <input id="token" type="password" data-i18n-placeholder="tokenPlaceholder" placeholder="вставьте токен или импортируйте файл" spellcheck="false" autocomplete="off" />
        </label>

        <div class="row-label">
          <button class="link" id="import" data-i18n="importBridge">Импорт bridge.json</button>
          <span class="muted" data-i18n="hintFile">~/.dsh/site-bridge/bridge.json</span>
        </div>
        <input id="import-file" type="file" accept=".json,application/json" hidden />
      </div>
    </details>

    <p class="hint" data-i18n="bannerHintShort">
      Плашка «началась отладка» в Chrome — ожидаема: через неё идёт ввод и чтение сети.
    </p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
